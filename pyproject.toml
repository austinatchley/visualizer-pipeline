[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualizer-pipeline"
version = "0.1.0"
description = "os.10.vs — batch audio-reactive visualizer renderer for beats"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.17.5"]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
vp = "vp.cli:main"

[tool.setuptools.packages.find]
include = ["vp*"]

[tool.setuptools.package-data]
"vp.ui" = ["static/*"]
"vp" = ["assets/fonts/*", "assets/fonts/licenses/*"]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom: `File(...)`/`Form(...)` defaults.
"vp/ui/server.py" = ["B008"]
