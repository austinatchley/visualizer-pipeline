[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualizer-pipeline"
version = "0.1.0"
description = "Batch audio-reactive visualizer renderer for beats"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vp = "vp.cli:main"

[tool.setuptools]
packages = ["vp"]