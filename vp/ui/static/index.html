<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vp studio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>vp <span class="dim">studio</span></h1>
    <div class="topbar-right">
      <span id="status" class="status"></span>
      <button id="save" class="btn primary" disabled>Save style</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Tracks</h2>
      <ul id="track-list" class="track-list"></ul>
    </aside>

    <main class="main">
      <section id="track" class="hidden">
        <div class="track-head">
          <h2 id="track-title">—</h2>
          <span id="track-meta" class="dim"></span>
        </div>

        <div class="preview-bar">
          <label>Preview
            <select id="aspect"></select>
          </label>
          <button id="preview" class="btn">Render preview</button>
          <video id="video" controls muted autoplay loop playsinline></video>
        </div>

        <h3>Style</h3>
        <div id="style-controls" class="controls"></div>

        <h3>Render</h3>
        <div class="render-bar">
          <div class="render-buttons">
            <button class="btn" data-render="vertical">Render 9:16</button>
            <button class="btn" data-render="square">Render 1:1</button>
            <button class="btn" data-render="horizontal">Render 16:9</button>
          </div>
          <div class="compare-buttons">
            <button id="cmp-a" class="btn">Set A</button>
            <button id="cmp-b" class="btn">Set B</button>
            <button id="cmp-run" class="btn primary">Compare A/B</button>
          </div>
        </div>
        <div id="jobs" class="jobs"></div>
        <div id="compare" class="compare hidden">
          <div class="compare-col">
            <span class="dim">A</span>
            <video id="cmp-a-video" controls autoplay loop muted playsinline></video>
          </div>
          <div class="compare-col">
            <span class="dim">B</span>
            <video id="cmp-b-video" controls autoplay loop muted playsinline></video>
          </div>
        </div>
      </section>

      <section id="empty" class="hidden empty">
        <p>No tracks found.</p>
        <p class="dim">Point <code>vp ui</code> at a root containing track folders (audio + images each), e.g. <code>vp ui --tracks tracks</code>.</p>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
