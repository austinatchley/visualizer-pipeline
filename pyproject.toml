[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualizer-pipeline"
version = "0.1.0"
description = "Batch audio-reactive visualizer renderer for beats"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
vp = "vp.cli:main"

[tool.setuptools.packages.find]
include = ["vp*"]

[tool.setuptools.package-data]
"vp.ui" = ["static/*"]